<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Pickaxe Inferno</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Подключаем шрифты для идеального сходства -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Jura:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Идеальная копия нижней панели -->
    <div id="arcade-controller">
      <div class="controller-top-bar">
        <div class="brand-title">PICKAXE <span class="inferno-text">INFERNO</span></div>
        <button id="btn-mode" class="mode-select">Classic ↗</button>
      </div>

      <div class="controller-grid">
        <div class="ctrl-col left-col">
          <button class="icon-btn">⚙️</button>
          <button class="auto-btn">AUTO</button>
        </div>

        <div class="ctrl-col center-col">
          <div class="dial-bg">
            <button id="btn-minus" class="dial-btn">-</button>
            <div class="dial-value"><span id="pickaxe-count-val">3</span></div>
            <button id="btn-plus" class="dial-btn">+</button>
          </div>
        </div>

        <div class="ctrl-col right-col">
          <button class="icon-btn blue-icon">⏩</button>
          <button class="icon-btn">🔊</button>
        </div>
      </div>

      <div class="stats-bar">
        <div class="stat-box">
          <span class="stat-label">БАЛАНС</span>
          <span id="val-balance" class="stat-value">78,800.00</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">СТАВКА</span>
          <span id="val-bet" class="stat-value">0.00</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">ВЫИГРЫШ</span>
          <span id="val-win" class="stat-value gold">666.00</span>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/block.js"></script>
  <script src="js/pickaxe.js"></script>
  <script src="js/particle.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/portal.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
